services:
  dev-juntos:
    container_name: titulo_supletorio_dev_juntos
    build:
      context: ./codigo_desarrolladores_logro/app_dev_juan_pablo
      dockerfile: Dockerfile
    volumes:
      - ./codigo_desarrolladores_logro/dev_repo:/usr/share/nginx/html/dev_repo
    ports:
      - "10003:80"
    restart: unless-stopped
    networks:
      - titulo_supletorio_frontend-net

networks:
  titulo_supletorio_frontend-net:
    name: titulo_supletorio_frontend-net
    driver: bridge

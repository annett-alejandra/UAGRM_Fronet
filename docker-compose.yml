version: '3.8'

services:
  # Entorno de Desarrollo (Vite HMR)
  frontend-dev:
    container_name: titulo_supletorio_frontend-dev
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "10001:3000"
    environment:
      - VITE_APP_ENV=development
    command: sh -c "if [ ! -d node_modules/vite ]; then npm install; fi && npm run dev -- --host"
    restart: unless-stopped
    networks:
      - titulo_supletorio_frontend-net
      - backend-network

  # Entorno de Produccin (Nginx)
  frontend-prod:
    container_name: titulo_supletorio_frontend-prod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10002:80"
    restart: unless-stopped
    networks:
      - titulo_supletorio_frontend-net
      - backend-network

networks:
  titulo_supletorio_frontend-net:
    name: titulo_supletorio_frontend-net
    driver: bridge
  backend-network:
    external: true
    name: titulo_supletorio_default

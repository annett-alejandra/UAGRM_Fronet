<div class="flex flex-col">
  @if (label) {
    <label class="block text-sm font-semibold text-gray-700 mb-1.5">
      {{ label }}
    </label>
  }
  <div class="relative w-full">
    <textarea
      [value]="value"
      (input)="onInput($event)"
      (blur)="onTouch()"
      [rows]="rows"
      [placeholder]="placeholder"
      [disabled]="isDisabled"
      [maxLength]="maxLength"
      class="block w-full rounded-lg border px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:border-transparent transition-all shadow-sm pb-8"
      [ngClass]="{
        'border-red-400 focus:ring-secundario-500 bg-red-50': invalido || isLimitReached,
        'border-gray-300 focus:ring-primario-900 bg-white': !invalido && !isLimitReached,
        'cursor-not-allowed opacity-60': isDisabled
      }"
    ></textarea>
    
    <div 
      class="absolute bottom-2 right-2 text-xs font-medium px-2 py-0.5 rounded pointer-events-none transition-colors"
      [ngClass]="{
        'text-red-600 bg-red-100/80': isLimitReached,
        'text-amber-600 bg-amber-100/80': isNearLimit,
        'text-gray-400': !isLimitReached && !isNearLimit
      }"
    >
      {{ value.length }} / {{ maxLength }}
    </div>
  </div>
</div>

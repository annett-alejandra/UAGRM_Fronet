@if (latLng()) {
  <!-- Overlay oscuro cuando está en pantalla completa -->
  @if (pantallaCompleta()) {
    <div class="fixed inset-0 bg-gray-900/50 z-40 backdrop-blur-sm transition-opacity" (click)="togglePantallaCompleta()"></div>
  }

  <div 
    [class]="pantallaCompleta() 
      ? 'fixed inset-4 md:inset-10 z-50 flex flex-col rounded-xl overflow-hidden border border-gray-200 shadow-2xl bg-white dark:bg-gray-900' 
      : 'rounded-xl overflow-hidden border border-gray-200 dark:border-gray-700 shadow-sm bg-white dark:bg-gray-900'"
  >

    <!-- Mapa Leaflet -->
    <div 
      [id]="mapaId" 
      [class]="pantallaCompleta() ? 'w-full flex-1 z-0' : 'w-full h-56 sm:h-[500px] z-0'"
    ></div>

    <!-- Pie del mapa -->
    <div class="px-4 py-3 flex flex-col sm:flex-row sm:items-center gap-3
                border-t border-gray-100 dark:border-gray-700
                bg-white dark:bg-gray-900">

      <div class="flex-1 min-w-0">
        @if (interactivo()) {
          <p class="text-sm font-medium text-primario mb-1">
            <svg class="w-4 h-4 inline-block mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122" />
            </svg>
            Haz clic en el mapa para seleccionar la ubicación
          </p>
        }
        @if (direccion()) {
          <div class="flex items-start gap-2">
            <!-- Pin icon con color primario -->
            <svg class="w-4 h-4 mt-0.5 shrink-0 text-primario"
                 fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
            <p class="text-sm text-gray-700 dark:text-gray-300 leading-snug">
              {{ direccion() }}
            </p>
          </div>
        } @else {
          <p class="text-sm text-gray-500 dark:text-gray-400">
            {{ latLng()![0].toFixed(5) }}, {{ latLng()![1].toFixed(5) }}
          </p>
        }
      </div>

      <!-- Acciones -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- Copiar coordenadas -->
        <button
          type="button"
          (click)="copiarCoordenadas()"
          [title]="copiado() ? '¡Copiado!' : 'Copiar coordenadas'"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium
                 rounded-lg border border-gray-200 dark:border-gray-600
                 text-gray-600 dark:text-gray-400
                 hover:border-primario hover:text-primario
                 transition-colors"
        >
          @if (copiado()) {
            <svg class="w-3.5 h-3.5 text-green-500" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            <span class="text-green-600">Copiado</span>
          } @else {
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
                 stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            Coordenadas
          }
        </button>

        <!-- Pantalla completa -->
        <button
          type="button"
          (click)="togglePantallaCompleta()"
          class="inline-flex items-center justify-center p-1.5 text-gray-500 rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-primario focus:ring-2 focus:ring-primario"
          [title]="pantallaCompleta() ? 'Reducir' : 'Ampliar mapa'"
        >
          @if (pantallaCompleta()) {
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 11l-4 4m0 0l4 4m-4-4h14m-14 0h14" />
            </svg>
          } @else {
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
            </svg>
          }
        </button>

        <!-- Ver en Google Maps -->
        <a
          [href]="urlGoogleMaps()"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold
                 rounded-lg bg-primario text-white
                 hover:opacity-90 transition-opacity"
        >
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24"
               stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
          Google Maps
        </a>
      </div>

    </div>
  </div>
}

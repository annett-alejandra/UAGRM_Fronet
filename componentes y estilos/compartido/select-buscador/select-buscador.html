<div class="relative w-full">
  <!-- Botón Disparador (Soporta multilínea sin cortar el texto seleccionado) -->
  <button
    type="button"
    (click)="toggleDropdown()"
    [disabled]="disabled"
    [class.opacity-50]="disabled"
    [class.cursor-not-allowed]="disabled"
    [class.border-red-400]="invalido"
    class="select-estilo w-full text-left flex items-center justify-between gap-2 cursor-pointer break-words whitespace-normal h-[42px] py-2 px-3 pr-8 relative bg-white border border-slate-200 rounded-xl shadow-2xs focus:outline-none focus:ring-2 focus:ring-primario/20 focus:border-primario font-medium text-slate-700 text-xs md:text-sm"
    [title]="opcionSeleccionada?.nombre ?? placeholder"
  >
    <span class="break-words whitespace-normal leading-snug block flex-1 truncate" [class.text-slate-400]="!opcionSeleccionada" [class.text-slate-700]="opcionSeleccionada">
      {{ opcionSeleccionada ? opcionSeleccionada.nombre : placeholder }}
    </span>
    <!-- Chevron -->
    <svg
      class="absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none transition-transform"
      [class.rotate-180]="dropdownAbierto"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
    >
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>

  <!-- Desplegable -->
  @if (dropdownAbierto) {
    <div
      class="absolute left-0 right-0 top-full mt-1.5 z-30 bg-white border border-slate-200 rounded-xl shadow-xl overflow-hidden flex flex-col max-h-64 animate-fadeIn"
    >
      <!-- Campo de Búsqueda (Sin recordatorio ni autocompletado del navegador) -->
      <div class="p-2 border-b border-slate-100 bg-slate-50/80 sticky top-0 z-10">
        <input
          #searchInput
          type="text"
          [placeholder]="'Buscar...'"
          [value]="busqueda"
          (input)="onInput($event)"
          class="w-full text-xs md:text-sm px-3 py-1.5 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-primario/20 focus:border-primario bg-white font-medium text-slate-700"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          name="select_search_no_remember"
        />
      </div>

      <!-- Opciones -->
      <div class="overflow-y-auto flex-1 max-h-48 divide-y divide-gray-50">
        @if (opcionesFiltradas.length === 0) {
          <div class="px-4 py-3 text-sm text-gray-400 text-center">
            Sin resultados para "{{ busqueda }}"
          </div>
        }

        @for (opcion of opcionesFiltradas; track opcion.id) {
          <div
            (mousedown)="seleccionar(opcion)"
            class="px-3 py-2.5 text-sm cursor-pointer capitalize flex items-start gap-2 hover:bg-gray-50 transition-colors"
            [class.bg-blue-50]="value === opcion.id"
            [class.text-blue-700]="value === opcion.id"
            [class.font-medium]="value === opcion.id"
          >
            <span 
              class="break-words whitespace-normal leading-snug flex items-center justify-start gap-2 flex-1"
              [class.text-gray-500]="opcion.esHijo"
              [class.ml-4]="opcion.esHijo"
              [class.font-bold]="opcion.destacada"
              [class.text-[#1c3766]]="opcion.destacada"
              [class.border-b]="opcion.destacada"
              [class.border-gray-200]="opcion.destacada"
              [class.w-full]="opcion.destacada"
              [class.pb-2]="opcion.destacada"
            >
              @if (mostrarTooltip && opcion.descripcion) {
                <app-tooltip [text]="opcion.descripcion" position="left">
                  <svg class="w-4 h-4 text-gray-400 hover:text-[#1c3766]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </app-tooltip>
              }

              <span>
                @if (opcion.esHijo) { ↳ } {{ opcion.nombre }}
              </span>
            </span>
            @if (value === opcion.id) {
              <svg class="w-4 h-4 shrink-0 mt-[2px]" fill="currentColor" viewBox="0 0 20 20">
                <path d="M16.707 5.293a1 1 0 00-1.414 0L8 12.586 4.707 9.293a1 1 0 00-1.414 1.414l4 4a1 1 0 001.414 0l8-8a1 1 0 000-1.414z" />
              </svg>
            } @else {
              <span class="w-4 shrink-0 mt-[2px]"></span>
            }
          </div>
        }
      </div>
    </div>
  }
</div>

<div class="w-full" [class.grid]="url()" [class.md:grid-cols-12]="url()" [class.gap-6]="url()">
  <!-- Columna Izquierda: Controles e Inputs -->
  <div [class.md:col-span-7]="url()" class="flex flex-col gap-3 w-full">
    <!-- Selector de Modo (Segmented Control) -->
    <div class="flex p-1 bg-gray-100 rounded-lg self-start">
      <button
        type="button"
        (click)="setModo('url')"
        [class]="
          modo() === 'url'
            ? 'bg-white shadow-sm text-gray-800'
            : 'text-gray-500 hover:text-gray-700'
        "
        class="flex items-center gap-2 px-3 py-1.5 rounded-md text-xs font-medium transition-all"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.826L10.242 9.172a4 4 0 015.656 0l4 4a4 4 0 01-5.656 5.656l-1.102 1.101"
          />
        </svg>
        URL externa
      </button>
      <button
        type="button"
        (click)="setModo('archivo')"
        [class]="
          modo() === 'archivo'
            ? 'bg-white shadow-sm text-gray-800'
            : 'text-gray-500 hover:text-gray-700'
        "
        class="flex items-center gap-2 px-3 py-1.5 rounded-md text-xs font-medium transition-all"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
          />
        </svg>
        Subir archivo
      </button>
    </div>

    <!-- Contenido según el modo -->
    <div class="w-full">
      <!-- Modo URL Externa -->
      @if (modo() === 'url') {
        <div class="relative group">
          <input
            type="text"
            [value]="url()"
            (input)="onUrlInput($event)"
            [disabled]="isDisabled || subiendo()"
            placeholder="https://ejemplo.com/imagen.jpg"
            class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm text-gray-700 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all outline-none"
          />
        </div>
      }

      <!-- Modo Subir Archivo (Dropzone) -->
      @if (modo() === 'archivo') {
        <div
          (click)="fileInput.click()"
          (drop)="onDrop($event)"
          (dragover)="onDragOver($event)"
          [class.border-blue-400]="!subiendo()"
          [class.bg-blue-50]="!subiendo()"
          class="relative w-full border-2 border-dashed border-gray-300 rounded-2xl p-8 transition-all cursor-pointer hover:border-blue-400 hover:bg-blue-50/50 group flex flex-col items-center justify-center text-center gap-3"
        >
          <input
            #fileInput
            type="file"
            class="hidden"
            [accept]="accept"
            (change)="onFileSelected($event)"
            [disabled]="isDisabled || subiendo()"
          />

          @if (subiendo()) {
            <div class="flex flex-col items-center gap-2">
              <svg
                class="animate-spin h-8 w-8 text-blue-500"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                ></circle>
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                ></path>
              </svg>
              <p class="text-xs font-semibold text-blue-600">Subiendo a MinIO...</p>
            </div>
          } @else {
            <!-- Icono de subida -->
            <div
              class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center group-hover:scale-110 transition-transform"
            >
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                />
              </svg>
            </div>

            <div>
              <p class="text-sm font-bold text-gray-800">
                {{ url() ? 'Cambiar archivo' : 'Click para seleccionar' }}
              </p>
              <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-wider font-semibold">
                Máx. 200MB
              </p>
            </div>
          }
        </div>
      }
    </div>

    <!-- Texto de Error -->
    @if (errorSubida()) {
      <div
        class="flex items-center gap-1.5 px-3 py-2 bg-red-50 text-red-600 rounded-lg border border-red-100"
      >
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
          <path
            fill-rule="evenodd"
            d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
            clip-rule="evenodd"
          />
        </svg>
        <p class="text-[10px] font-bold uppercase">{{ errorSubida() }}</p>
      </div>
    }
  </div>

  <!-- Columna Derecha: Previsualización -->
  @if (url()) {
    <div class="md:col-span-5 flex flex-col gap-2">
      <div
        class="relative group rounded-2xl overflow-hidden border border-gray-200 bg-black aspect-video flex items-center justify-center"
      >
        @if (esVideo()) {
          <video [src]="url()" controls class="w-full h-full object-contain"></video>
        } @else {
          <img
            [src]="url()"
            alt="Preview"
            class="max-w-full max-h-full object-contain"
            onerror="this.src = 'assets/img/placeholder.png'"
          />
        }
      </div>
    </div>
  }
</div>

<div class="flex items-center justify-between gap-4">
  <nav class="flex items-center gap-1">
    <!-- Anterior -->
    <button
      (click)="goTo(currentPage - 1)"
      [disabled]="currentPage === 1"
      class="flex items-center gap-1 px-3 h-8 rounded-lg border text-xs font-medium transition-colors border-gray-300 text-gray-600 hover:bg-gray-50 hover:border-gray-400 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-gray-300"
    >
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
      Anterior
    </button>

    <!-- Números de página con lógica de ventana deslizante -->
    @if (totalPages <= 7) {
      <!-- Pocas páginas: mostrar todas -->
      @for (page of pages; track page) {
        <button
          (click)="goTo(page)"
          class="w-8 h-8 rounded-lg border text-xs font-semibold transition-colors"
          [class]="
            page === currentPage
              ? 'bg-[#1c3766] text-white border-[#1c3766] shadow-sm'
              : 'border-gray-300 text-gray-600 hover:bg-gray-50 hover:border-gray-400'
          "
        >
          {{ page }}
        </button>
      }
    } @else {
      <!-- Muchas páginas: mostrar ventana con elipsis -->

      <!-- Siempre página 1 -->
      <button
        (click)="goTo(1)"
        class="w-8 h-8 rounded-lg border text-xs font-semibold transition-colors"
        [class]="
          currentPage === 1
            ? 'bg-[#1c3766] text-white border-[#1c3766] shadow-sm'
            : 'border-gray-300 text-gray-600 hover:bg-gray-50 hover:border-gray-400'
        "
      >
        1
      </button>

      <!-- Elipsis izquierdo -->
      @if (currentPage > 4) {
        <span class="w-8 h-8 flex items-end justify-center text-gray-400 text-sm pb-1">···</span>
      }

      <!-- Páginas del medio -->
      @for (page of middlePages; track page) {
        <button
          (click)="goTo(page)"
          class="w-8 h-8 rounded-lg border text-xs font-semibold transition-colors"
          [class]="
            page === currentPage
              ? 'bg-[#1c3766] text-white border-[#1c3766] shadow-sm'
              : 'border-gray-300 text-gray-600 hover:bg-gray-50 hover:border-gray-400'
          "
        >
          {{ page }}
        </button>
      }

      <!-- Elipsis derecho -->
      @if (currentPage < totalPages - 3) {
        <span class="w-8 h-8 flex items-end justify-center text-gray-400 text-sm pb-1">···</span>
      }

      <!-- Siempre última página -->
      <button
        (click)="goTo(totalPages)"
        class="w-8 h-8 rounded-lg border text-xs font-semibold transition-colors"
        [class]="
          currentPage === totalPages
            ? 'bg-[#1c3766] text-white border-[#1c3766] shadow-sm'
            : 'border-gray-300 text-gray-600 hover:bg-gray-50 hover:border-gray-400'
        "
      >
        {{ totalPages }}
      </button>
    }

    <!-- Siguiente -->
    <button
      (click)="goTo(currentPage + 1)"
      [disabled]="currentPage === totalPages"
      class="flex items-center gap-1 px-3 h-8 rounded-lg border text-xs font-medium transition-colors border-gray-300 text-gray-600 hover:bg-gray-50 hover:border-gray-400 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-gray-300"
    >
      Siguiente
      <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </nav>
</div>
